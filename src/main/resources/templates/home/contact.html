<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{homebase::Layout(~{::section})}">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="X-UA-Compatible" content="ie=edge">
	<title>MovieMingle - Home</title>
</head>

<body>

	<section class="content-section">
		<div class="contactcontainer">
			<form action="/home/contactform" method="POST" enctype="multipart/form-data">
				<th:block th:if="${session.successMsg}">
					<div id="notification" class="notification" th:text="${session.successMsg}"></div>
					<script>
						document.addEventListener('DOMContentLoaded', function () {
							var notification = document.getElementById('notification');
							if (notification) {
								// Show the notification
								notification.classList.add('show');
								// Hide the notification after 5 seconds
								setTimeout(function () {
									notification.classList.remove('show');
								}, 5000);
							}
						});
					</script>
					<th:block th:text="${@commonServiceImpl.removeSessionMessage()}"></th:block>
				</th:block>
				<div class="form-group">
					<label for="name">Name:</label>
					<input type="text" id="name" name="contactName" required>
				</div>
				<div class="form-group">
					<label for="email">Email:</label>
					<input type="email" id="email" name="contactEmail" required>
				</div>
				<div class="form-group">
					<label for="subject">Subject:</label>
					<input type="text" id="subject" name="contactSubject" required>
				</div>
				<div class="form-group">
					<label for="message">Message:</label>
					<textarea id="message" name="contactMessage" rows="5" required></textarea>
				</div>
				<button class="contactbutton" type="submit">Send Message</button>
			</form>
		</div>
	</section>
</body>

</html>
